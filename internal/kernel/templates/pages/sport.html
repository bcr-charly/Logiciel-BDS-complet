{{define "content"}}
<h1 class="section-title">{{.Data.sport.Nom}}</h1>
<p class="muted" style="max-width:640px;line-height:1.6;">{{.Data.sport.Description}}</p>

<h2 class="section-title" style="margin-top:2.5rem;font-size:1.2rem;">{{t . "nav_evenements"}}</h2>
<div class="liste">
{{range .Data.evenements}}{{if eq .Sport $.Data.sport.Slug}}
  <article class="carte">
    <h3 style="margin:0;"><a href="/evenements/{{.ID}}">{{.Nom}}</a></h3>
    <p class="muted" style="margin:.3rem 0 0;font-size:.9rem;">{{date .Date}} — {{.Lieu}}</p>
  </article>
{{end}}{{end}}
</div>

{{template "bande_annonces" (dict "V" $ "Annonces" .Data.annonces)}}
{{end}}
